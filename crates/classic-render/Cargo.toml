[package]
name = "classic-render"
version = "0.1.0"
description = "Draws a Classic engine game with wgpu, and the desktop player. Reads the game state; never changes it."
edition.workspace = true
license.workspace = true
publish.workspace = true

# The renderer is the one part of the engine with third-party dependencies (Ed chose wgpu, 2026-10-07). The platform
# layer (GPU, sprites, font, sound, files, the browser page) is `rts-platform` from the shared `rts-core`
# repository, which brings wgpu and cpal. Here: wgpu draws the map, winit opens the window (or the page's canvas),
# pollster waits for wgpu's async set-up on the desktop, and png reads the setting pack's art. The simulation crates
# still have none.
[dependencies]
classic-ai = { path = "../classic-ai" }
classic-sim = { path = "../classic-sim" }
classic-data = { path = "../classic-data" }
classic-tools = { path = "../classic-tools" }
rts-platform = { workspace = true }
wgpu = "30"
png = "0.18"
winit = "0.30"

# `device` opens the sound card (cpal, in `rts-platform`). Without it the player is silent, and on Linux nothing needs
# ALSA's headers (`libasound2-dev`) to build: `cargo build --no-default-features -p classic-render`.
[features]
default = ["device"]
device = ["rts-platform/device"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "1"

# The browser build: WebGL2 as well as WebGPU, and running the player's start-up on the page's event loop.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30", features = ["webgl"] }
wasm-bindgen-futures = "0.4"
# The page's local storage keeps the player's settings and saved game (`store.rs`).
web-sys = { version = "0.3", features = ["Storage", "Window"] }
