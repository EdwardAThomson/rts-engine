name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the compiler, clippy, rustfmt and the WebAssembly target.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      # The renderer's tests draw offscreen on Mesa's software GPU; the player's smoke run needs a virtual display;
      # the sound device (cpal) builds against ALSA's headers.
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libxkbcommon-x11-0 xvfb libasound2-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --target wasm32-unknown-unknown -p classic-wasm -- -D warnings
      - run: cargo test
      - name: WebAssembly build plays the same games as the native build
        run: |
          cargo build --release --target wasm32-unknown-unknown -p classic-wasm
          node web/check.mjs
      - run: cargo run --release --bin cli -- --seed 1 --ticks 9000 --every 1500
      - name: The desktop player opens a window and draws
        run: xvfb-run -a cargo run --bin play -- --frames 60
