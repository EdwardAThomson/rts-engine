[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

# The genre-neutral core shared with the 3D engine, pinned by commit: moving to a newer one is a deliberate change
# that must keep the golden tests passing. `rts-platform`, from the same repository, is the renderer's platform layer
# (GPU, sprites, font, sound, files, the browser page), shared with the 3D engine's renderer.
[workspace.dependencies]
rts-core = { git = "https://github.com/EdwardAThomson/rts-core", rev = "da80e8730d22dcd6f34194787e168b565982af4c" }
rts-platform = { git = "https://github.com/EdwardAThomson/rts-core", rev = "eca48d5f6382eaac383820d55e7d2f4749164ca5", default-features = false }

# Tests replay thousands of ticks; a little optimisation keeps them quick without slowing builds much.
[profile.test]
opt-level = 1

[profile.release]
codegen-units = 1
lto = true
